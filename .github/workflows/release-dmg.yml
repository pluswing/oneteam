name: Build macOS DMG

on:
  release:
    types:
      - published

permissions:
  contents: write

concurrency:
  group: release-dmg-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build-macos-dmg:
    name: Build and upload DMG
    runs-on: macos-latest
    timeout-minutes: 45

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build app
        run: npm run build

      - name: Build DMG
        run: npx electron-builder --mac dmg --publish never

      - name: Upload DMG to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmg_files=(release/*.dmg)
          if [ ${#dmg_files[@]} -eq 0 ]; then
            echo "No DMG files found in release/."
            find release -maxdepth 2 -type f -print || true
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${dmg_files[@]}" --clobber
